<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Animated Flowing Border Gradient -->
    <linearGradient id="borderGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55">
        <animate attributeName="stop-color" values="#FF2A55;#EA580C;#E11D48;#BE123C;#FF2A55" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#EA580C">
        <animate attributeName="stop-color" values="#EA580C;#E11D48;#BE123C;#FF2A55;#EA580C" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#E11D48">
        <animate attributeName="stop-color" values="#E11D48;#BE123C;#FF2A55;#EA580C;#E11D48" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Pulsing Red Heartbeat Glow behind Code Text -->
    <radialGradient id="textPulseDark" cx="45%" cy="58%" r="48%">
      <animate attributeName="r" values="36%;54%;36%" dur="3.2s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.32">
        <animate attributeName="stop-opacity" values="0.12;0.40;0.12" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="42%" stop-color="#E11D48" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.06;0.24;0.06" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="72%" stop-color="#881337" stop-opacity="0.08">
        <animate attributeName="stop-opacity" values="0.02;0.10;0.02" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF2A55" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 13px;
      fill: #cbd5e1;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .code-text {
      font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 14.5px;
      font-weight: 500;
    }
    .brace { fill: #f43f5e; font-weight: 700; }
    .key { fill: #60a5fa; font-weight: 700; }
    .colon { fill: #cbd5e1; }
    .string { fill: #f1f5f9; }
    .highlight-string { fill: #38bdf8; font-weight: 600; }
    .math-string { fill: #FB7185; font-weight: 700; }
    .array-bracket { fill: #fbbf24; font-weight: 700; }
    .array-item { fill: #86efac; font-weight: 600; }

    /* Terminal Blinking Cursor */
    .cursor-dark {
      fill: #FF2A55;
      font-family: "Fira Code", monospace;
      font-weight: 700;
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Main Card Container: Transparent to blend with GitHub background -->
  <rect x="2" y="2" width="796" height="286" rx="14" fill="none" stroke="url(#borderGradDark)" stroke-width="1.8"/>

  <!-- Pulsing Red Glow Layer directly behind Code Text -->
  <rect x="2" y="44" width="796" height="244" rx="14" fill="url(#textPulseDark)"/>

  <!-- Window Header: Sleek semi-transparent dark bar -->
  <rect x="2" y="2" width="796" height="42" rx="14" fill="#161b22" fill-opacity="0.45"/>
  <rect x="2" y="32" width="796" height="12" fill="#161b22" fill-opacity="0.45"/>
  <line x1="2" y1="44" x2="798" y2="44" stroke="#30363d" stroke-width="1.2"/>

  <!-- macOS Window Controls with Glossy Details -->
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="24" cy="22" r="5.5" stroke="#e0443e" stroke-width="0.8" fill="none"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="44" cy="22" r="5.5" stroke="#dea123" stroke-width="0.8" fill="none"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <circle cx="64" cy="22" r="5.5" stroke="#1aab29" stroke-width="0.8" fill="none"/>

  <!-- Centered Clean Terminal Title -->
  <text x="400" y="27" text-anchor="middle" class="title-text">saleh@cloud: ~/about.json</text>

  <!-- Code Body -->
  <g transform="translate(32, 72)" class="code-text">
    <text x="0" y="0" class="brace">{</text>

    <text x="24" y="24">
      <tspan class="key">"name"</tspan><tspan class="colon">: </tspan><tspan class="string">"Saleh"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="48">
      <tspan class="key">"education"</tspan><tspan class="colon">: </tspan><tspan class="math-string">"M.Sc. in Mathematics"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="72">
      <tspan class="key">"ml_platform"</tspan><tspan class="colon">: </tspan><tspan class="highlight-string">"Google Cloud BigQuery (BigQuery ML)"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="96">
      <tspan class="key">"focus"</tspan><tspan class="colon">: </tspan><tspan class="string">"Mathematical Modeling, Data Analytics &amp; Machine Learning"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="120">
      <tspan class="key">"strengths"</tspan><tspan class="colon">: </tspan><tspan class="array-bracket">[</tspan>
      <tspan class="array-item">"Probability &amp; Stats"</tspan><tspan class="colon">, </tspan>
      <tspan class="array-item">"Linear Algebra"</tspan><tspan class="colon">, </tspan>
      <tspan class="array-item">"SQL &amp; BigQuery"</tspan><tspan class="colon">, </tspan>
      <tspan class="array-item">"Python"</tspan>
      <tspan class="array-bracket">]</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="144">
      <tspan class="key">"passion"</tspan><tspan class="colon">: </tspan><tspan class="string">"Bridging Pure Mathematics with Real-World Data"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="168">
      <tspan class="key">"location"</tspan><tspan class="colon">: </tspan><tspan class="string">"Jordan"</tspan><tspan class="cursor-dark"> ▋</tspan>
    </text>

    <text x="0" y="196" class="brace">}</text>
  </g>
</svg>
