<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="stop-bg-1"/>
      <stop offset="100%" class="stop-bg-2"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="stop-border-1"/>
      <stop offset="50%" class="stop-border-2"/>
      <stop offset="100%" class="stop-border-3"/>
    </linearGradient>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="stop-header-1"/>
      <stop offset="100%" class="stop-header-2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    /* Default Dark Mode */
    .stop-bg-1 { stop-color: #0b0f19; }
    .stop-bg-2 { stop-color: #111827; }
    .stop-border-1 { stop-color: #8b5cf6; stop-opacity: 0.6; }
    .stop-border-2 { stop-color: #3b82f6; stop-opacity: 0.3; }
    .stop-border-3 { stop-color: #10b981; stop-opacity: 0.6; }
    .stop-header-1 { stop-color: #162032; }
    .stop-header-2 { stop-color: #0f172a; }
    .header-line { stroke: #1e293b; }
    .tab-rect { fill: #0b0f19; stroke: #334155; }
    .tab-icon { font-family: "Fira Code", monospace; font-size: 11px; fill: #fbbf24; font-weight: 800; }
    .tab-text { font-family: "Fira Code", "JetBrains Mono", Consolas, monospace; font-size: 12px; fill: #e2e8f0; font-weight: 600; }
    .tab-close { stroke: #64748b; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; fill: #94a3b8; font-weight: 500; }
    .tag-rect { fill: rgba(139, 92, 246, 0.15); stroke: #8b5cf6; }
    .tag-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #c4b5fd; font-weight: 700; letter-spacing: 0.3px; }
    .live-dot-glow { fill: #10b981; fill-opacity: 0.3; }
    .live-dot { fill: #10b981; }
    .bolt-path { fill: #fbbf24; }
    .code-text { font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 13.5px; }
    .brace { fill: #f43f5e; font-weight: 700; }
    .key { fill: #79c0ff; font-weight: 600; }
    .colon { fill: #94a3b8; }
    .string { fill: #a5d6ff; }
    .highlight-string { fill: #38bdf8; font-weight: 600; }
    .math-string { fill: #c084fc; font-weight: 600; }
    .array-bracket { fill: #fbbf24; }
    .array-item { fill: #86efac; }

    /* Light Mode */
    @media (prefers-color-scheme: light) {
      .stop-bg-1 { stop-color: #ffffff; }
      .stop-bg-2 { stop-color: #f8fafc; }
      .stop-border-1 { stop-color: #7c3aed; stop-opacity: 0.45; }
      .stop-border-2 { stop-color: #0284c7; stop-opacity: 0.35; }
      .stop-border-3 { stop-color: #059669; stop-opacity: 0.45; }
      .stop-header-1 { stop-color: #ffffff; }
      .stop-header-2 { stop-color: #f1f5f9; }
      .header-line { stroke: #e2e8f0; }
      .tab-rect { fill: #ffffff; stroke: #cbd5e1; }
      .tab-icon { fill: #d97706; }
      .tab-text { fill: #0f172a; }
      .tab-close { stroke: #94a3b8; }
      .title-text { fill: #64748b; }
      .tag-rect { fill: rgba(124, 58, 237, 0.08); stroke: #7c3aed; }
      .tag-label { fill: #6d28d9; }
      .live-dot-glow { fill: #059669; fill-opacity: 0.25; }
      .live-dot { fill: #059669; }
      .bolt-path { fill: #d97706; }
      .brace { fill: #e11d48; }
      .key { fill: #0284c7; }
      .colon { fill: #64748b; }
      .string { fill: #1e293b; }
      .highlight-string { fill: #0369a1; }
      .math-string { fill: #7c3aed; }
      .array-bracket { fill: #d97706; }
      .array-item { fill: #059669; font-weight: 600; }
    }
  </style>

  <!-- Main Card Container -->
  <rect x="2" y="2" width="796" height="286" rx="14" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.8" filter="url(#shadow)"/>

  <!-- Window Header -->
  <rect x="2" y="2" width="796" height="42" rx="14" fill="url(#headerBg)"/>
  <rect x="2" y="32" width="796" height="12" fill="url(#headerBg)"/>
  <line x1="2" y1="44" x2="798" y2="44" class="header-line" stroke-width="1.2"/>

  <!-- macOS Window Controls with Subtle Highlights -->
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="24" cy="22" r="5.5" stroke="#e0443e" stroke-width="0.8" fill="none"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="44" cy="22" r="5.5" stroke="#dea123" stroke-width="0.8" fill="none"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <circle cx="64" cy="22" r="5.5" stroke="#1aab29" stroke-width="0.8" fill="none"/>

  <!-- Editor Active Tab -->
  <rect x="88" y="8" width="136" height="28" rx="6" class="tab-rect" stroke-width="1"/>
  <text x="100" y="26" class="tab-icon">{ }</text>
  <text x="122" y="26" class="tab-text">about.json</text>
  <path d="M 210 19 L 216 25 M 216 19 L 210 25" class="tab-close" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Terminal Breadcrumb Path in Center -->
  <text x="440" y="26" text-anchor="middle" class="title-text">saleh@cloud: ~/profile</text>

  <!-- Right Side Live Tag with Vector Icon -->
  <rect x="676" y="10" width="108" height="24" rx="12" class="tag-rect" stroke-width="1"/>
  <circle cx="692" cy="22" r="5.5" class="live-dot-glow"/>
  <circle cx="692" cy="22" r="3.5" class="live-dot"/>
  <g transform="translate(704, 15)">
    <path d="M5 0 L1 7 H5 L4 13 L11 5 H6.5 Z" class="bolt-path"/>
  </g>
  <text x="736" y="26" class="tag-label">Live Bio</text>

  <!-- Code Body -->
  <g transform="translate(32, 72)" class="code-text">
    <text x="0" y="0" class="brace">{</text>

    <text x="24" y="24">
      <tspan class="key">"name"</tspan><tspan class="colon">: </tspan><tspan class="string">"Saleh"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="48">
      <tspan class="key">"education"</tspan><tspan class="colon">: </tspan><tspan class="math-string">"M.Sc. in Mathematics"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="72">
      <tspan class="key">"ml_platform"</tspan><tspan class="colon">: </tspan><tspan class="highlight-string">"Google Cloud BigQuery (BigQuery ML)"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="96">
      <tspan class="key">"focus"</tspan><tspan class="colon">: </tspan><tspan class="string">"Mathematical Modeling, Data Analytics &amp; Machine Learning"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="120">
      <tspan class="key">"strengths"</tspan><tspan class="colon">: </tspan><tspan class="array-bracket">[</tspan>
      <tspan class="array-item">"Probability &amp; Stats"</tspan><tspan class="colon">, </tspan>
      <tspan class="array-item">"Linear Algebra"</tspan><tspan class="colon">, </tspan>
      <tspan class="array-item">"SQL &amp; BigQuery"</tspan><tspan class="colon">, </tspan>
      <tspan class="array-item">"Python"</tspan>
      <tspan class="array-bracket">]</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="144">
      <tspan class="key">"passion"</tspan><tspan class="colon">: </tspan><tspan class="string">"Bridging Pure Mathematics with Real-World Data"</tspan><tspan class="colon">,</tspan>
    </text>

    <text x="24" y="168">
      <tspan class="key">"location"</tspan><tspan class="colon">: </tspan><tspan class="string">"Jordan"</tspan>
    </text>

    <text x="0" y="196" class="brace">}</text>
  </g>
</svg>
