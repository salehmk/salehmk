<svg
  width="350"
  height="215"
  viewBox="0 0 350 215"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Saleh's Most Used Languages with Topology Mobius Symbol</desc>
  <defs>
    <!-- Mobius Strip Gradients (Dark Mode Crimson/Scarlet) -->
    <linearGradient id="mobiusGradFrontDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="mobiusGradBackDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="50%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <radialGradient id="mobiusAuraDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.30">
        <animate attributeName="stop-opacity" values="0.15;0.40;0.15" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF2A55" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .header {
      font: 700 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #FF2A55;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 500 12px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #FFFFFF;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.5s ease-in-out forwards;
    }
    .mobius-symbol {
      animation: pulseMobius 3s ease-in-out infinite;
      transform-origin: 116.67px 116.67px;
    }
    @keyframes pulseMobius {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <!-- Background Card -->
  <rect
    x="0.5"
    y="0.5"
    rx="6"
    height="214"
    width="349"
    fill="#0D1117"
    stroke="#30363D"
    stroke-width="1"
  />

  <!-- Title -->
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Main Body -->
  <g transform="translate(0, 55)">
    <!-- Legend Items (Left) -->
    <g transform="translate(25, 0)">
      <g transform="translate(0, 0)" class="stagger" style="animation-delay: 200ms">
        <circle cx="5" cy="6" r="5" fill="#DA5B0B" />
        <text x="16" y="10" class="lang-name">Jupyter Notebook 89.94%</text>
      </g>
      <g transform="translate(0, 32)" class="stagger" style="animation-delay: 350ms">
        <circle cx="5" cy="6" r="5" fill="#e34c26" />
        <text x="16" y="10" class="lang-name">HTML 4.79%</text>
      </g>
      <g transform="translate(0, 64)" class="stagger" style="animation-delay: 500ms">
        <circle cx="5" cy="6" r="5" fill="#663399" />
        <text x="16" y="10" class="lang-name">CSS 3.84%</text>
      </g>
      <g transform="translate(0, 96)" class="stagger" style="animation-delay: 650ms">
        <circle cx="5" cy="6" r="5" fill="#f1e05a" />
        <text x="16" y="10" class="lang-name">JavaScript 1.04%</text>
      </g>
      <g transform="translate(0, 128)" class="stagger" style="animation-delay: 800ms">
        <circle cx="5" cy="6" r="5" fill="#3572A5" />
        <text x="16" y="10" class="lang-name">Python 0.39%</text>
      </g>
    </g>

    <!-- Donut Chart & Mobius Strip (Right) -->
    <g transform="translate(125, -45)">
      <svg width="350" height="350">
        <!-- Donut Ring Arcs -->
        <g class="stagger" style="animation-delay: 400ms">
          <!-- Jupyter Notebook 89.94% -->
          <path
            d="M 83.1862 70.9483 A 56.6667 56.6667 0 1 0 116.6667 60"
            stroke="#DA5B0B"
            fill="none"
            stroke-width="12"
          />
        </g>
        <g class="stagger" style="animation-delay: 550ms">
          <!-- HTML 4.79% -->
          <path
            d="M 98.2440 63.0783 A 56.6667 56.6667 0 0 0 83.1862 70.9483"
            stroke="#e34c26"
            fill="none"
            stroke-width="12"
          />
        </g>
        <g class="stagger" style="animation-delay: 700ms">
          <!-- CSS 3.84% -->
          <path
            d="M 111.5820 60.2286 A 56.6667 56.6667 0 0 0 98.2440 63.0783"
            stroke="#663399"
            fill="none"
            stroke-width="12"
          />
        </g>
        <g class="stagger" style="animation-delay: 850ms">
          <!-- JavaScript 1.04% -->
          <path
            d="M 115.2782 60.0170 A 56.6667 56.6667 0 0 0 111.5820 60.2286"
            stroke="#f1e05a"
            fill="none"
            stroke-width="12"
          />
        </g>
        <g class="stagger" style="animation-delay: 1000ms">
          <!-- Python 0.39% -->
          <path
            d="M 116.6667 60 A 56.6667 56.6667 0 0 0 115.2782 60.0170"
            stroke="#3572A5"
            fill="none"
            stroke-width="12"
          />
        </g>

        <!-- Topology Mobius Strip Center Emblem -->
        <g class="stagger mobius-symbol" style="animation-delay: 750ms">
          <!-- Ambient Circular Glow inside the Donut Hole -->
          <circle cx="116.67" cy="116.67" r="46" fill="url(#mobiusAuraDark)" />

          <!-- 3D Ribbon Mobius Strip -->
          <g transform="translate(116.67, 116.67) scale(0.185) translate(-200, -120)">
            <!-- Back Loop / Twist Strand -->
            <path
              d="M 200,120 C 140,120 90,80 90,50 C 90,20 140,10 200,50 C 260,90 310,130 310,180 C 310,220 260,240 200,240 C 130,240 80,210 50,175 L 75,150 C 100,180 140,210 200,210 C 240,210 275,195 275,180 C 275,160 230,130 200,120 Z"
              fill="url(#mobiusGradBackDark)"
              stroke="#881337"
              stroke-width="2.5"
            />
            <!-- Front Loop / Overlapping Ribbon Strand -->
            <path
              d="M 200,120 C 260,120 310,160 310,190 C 310,220 260,230 200,190 C 140,150 90,110 90,60 C 90,20 140,0 200,0 C 270,0 320,30 350,65 L 325,90 C 300,60 260,30 200,30 C 160,30 125,45 125,60 C 125,80 170,110 200,120 Z"
              fill="url(#mobiusGradFrontDark)"
              stroke="#FF2A55"
              stroke-width="2.5"
            />
          </g>
        </g>
      </svg>
    </g>
  </g>
</svg>
