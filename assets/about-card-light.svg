<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Animated Flowing Border Gradient -->
    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.65">
        <animate attributeName="stop-color" values="#DC2626;#EA580C;#E11D48;#BE123C;#DC2626" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#EA580C" stop-opacity="0.45">
        <animate attributeName="stop-color" values="#EA580C;#E11D48;#BE123C;#DC2626;#EA580C" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0.65">
        <animate attributeName="stop-color" values="#BE123C;#DC2626;#EA580C;#E11D48;#BE123C" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Pulsing Red Heartbeat Glow behind Code Text (Light Mode) -->
    <radialGradient id="textPulseLight" cx="45%" cy="58%" r="48%">
      <animate attributeName="r" values="36%;54%;36%" dur="3.2s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.05;0.18;0.05" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="42%" stop-color="#BE123C" stop-opacity="0.08">
        <animate attributeName="stop-opacity" values="0.02;0.10;0.02" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="72%" stop-color="#9F1239" stop-opacity="0.04">
        <animate attributeName="stop-opacity" values="0.01;0.05;0.01" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title-text-light {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 13px;
      fill: #1e293b;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .code-text-light {
      font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 14.5px;
      font-weight: 500;
    }
    .brace-light { fill: #e11d48; font-weight: 700; }
    .key-light { fill: #0369a1; font-weight: 700; }
    .colon-light { fill: #334155; font-weight: 600; }
    .string-light { fill: #0f172a; font-weight: 500; }
    .highlight-string-light { fill: #0284c7; font-weight: 700; }
    .math-string-light { fill: #BE123C; font-weight: 700; }
    .array-bracket-light { fill: #b45309; font-weight: 700; }
    .array-item-light { fill: #047857; font-weight: 600; }

    /* Terminal Blinking Cursor */
    .cursor-light {
      fill: #DC2626;
      font-family: "Fira Code", monospace;
      font-weight: 700;
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Main Card Container: Transparent to blend with GitHub background -->
  <rect x="2" y="2" width="796" height="286" rx="14" fill="none" stroke="url(#borderGradLight)" stroke-width="1.8"/>

  <!-- Pulsing Red Glow Layer directly behind Code Text -->
  <rect x="2" y="44" width="796" height="244" rx="14" fill="url(#textPulseLight)"/>

  <!-- Window Header: Sleek semi-transparent bar -->
  <rect x="2" y="2" width="796" height="42" rx="14" fill="#f6f8fa" fill-opacity="0.55"/>
  <rect x="2" y="32" width="796" height="12" fill="#f6f8fa" fill-opacity="0.55"/>
  <line x1="2" y1="44" x2="798" y2="44" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- macOS Window Controls with Glossy Details -->
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="24" cy="22" r="5.5" stroke="#e0443e" stroke-width="0.8" fill="none"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="44" cy="22" r="5.5" stroke="#dea123" stroke-width="0.8" fill="none"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <circle cx="64" cy="22" r="5.5" stroke="#1aab29" stroke-width="0.8" fill="none"/>

  <!-- Centered Clean Terminal Title -->
  <text x="400" y="27" text-anchor="middle" class="title-text-light">saleh@cloud: ~/about.json</text>

  <!-- Code Body -->
  <g transform="translate(32, 72)" class="code-text-light">
    <text x="0" y="0" class="brace-light">{</text>

    <text x="24" y="24">
      <tspan class="key-light">"name"</tspan><tspan class="colon-light">: </tspan><tspan class="string-light">"Saleh"</tspan><tspan class="colon-light">,</tspan>
    </text>

    <text x="24" y="48">
      <tspan class="key-light">"education"</tspan><tspan class="colon-light">: </tspan><tspan class="math-string-light">"M.Sc. in Mathematics"</tspan><tspan class="colon-light">,</tspan>
    </text>

    <text x="24" y="72">
      <tspan class="key-light">"ml_platform"</tspan><tspan class="colon-light">: </tspan><tspan class="highlight-string-light">"Google Cloud BigQuery (BigQuery ML)"</tspan><tspan class="colon-light">,</tspan>
    </text>

    <text x="24" y="96">
      <tspan class="key-light">"focus"</tspan><tspan class="colon-light">: </tspan><tspan class="string-light">"Mathematical Modeling, Data Analytics &amp; Machine Learning"</tspan><tspan class="colon-light">,</tspan>
    </text>

    <text x="24" y="120">
      <tspan class="key-light">"strengths"</tspan><tspan class="colon-light">: </tspan><tspan class="array-bracket-light">[</tspan>
      <tspan class="array-item-light">"Probability &amp; Stats"</tspan><tspan class="colon-light">, </tspan>
      <tspan class="array-item-light">"Linear Algebra"</tspan><tspan class="colon-light">, </tspan>
      <tspan class="array-item-light">"SQL &amp; BigQuery"</tspan><tspan class="colon-light">, </tspan>
      <tspan class="array-item-light">"Python"</tspan>
      <tspan class="array-bracket-light">]</tspan><tspan class="colon-light">,</tspan>
    </text>

    <text x="24" y="144">
      <tspan class="key-light">"passion"</tspan><tspan class="colon-light">: </tspan><tspan class="string-light">"Bridging Pure Mathematics with Real-World Data"</tspan><tspan class="colon-light">,</tspan>
    </text>

    <text x="24" y="168">
      <tspan class="key-light">"location"</tspan><tspan class="colon-light">: </tspan><tspan class="string-light">"Jordan"</tspan><tspan class="cursor-light"> ▋</tspan>
    </text>

    <text x="0" y="196" class="brace-light">}</text>
  </g>
</svg>
