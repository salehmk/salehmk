<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="headerGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9" />
