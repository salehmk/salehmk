<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Dark Mode Gradients -->
    <linearGradient id="hFrontDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#7C3AED" stop-opacity="0.92" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="hMidDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="hGaussGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0" />
    </linearGradient>
    
    <!-- Light Mode Gradients -->
    <linearGradient id="hFrontLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#6D28D9" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#9333EA" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="hMidLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3" />
    </linearGradient>
    
    <filter id="neonGlowCyanH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveSlideLeft {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-600px, 0, 0); }
    }
    @keyframes waveSlideRight {
      0% { transform: translate3d(-600px, 0, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.18); }
    }
    @keyframes floatMath {
      0%, 100% { transform: translateY(0px); opacity: 0.45; }
      50% { transform: translateY(-4px); opacity: 0.85; }
    }

    .anim-wave-front {
      animation: waveSlideLeft 12s linear infinite;
    }
    .anim-wave-mid {
      animation: waveSlideRight 18s linear infinite;
    }
    .pulse-node {
      transform-origin: center;
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .math-symbol {
      font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-weight: 700;
      animation: floatMath 4s ease-in-out infinite;
    }

    .theme-front { fill: url(#hFrontDark); }
    .theme-mid { fill: url(#hMidDark); }
    .theme-stroke-gauss { stroke: #06B6D4; }
    .theme-fill-gauss { fill: url(#hGaussGradDark); }
    .theme-grid { stroke: rgba(148, 163, 184, 0.12); }
    .theme-sym { fill: #38BDF8; }

    @media (prefers-color-scheme: light) {
      .theme-front { fill: url(#hFrontLight); }
      .theme-mid { fill: url(#hMidLight); }
      .theme-stroke-gauss { stroke: #0284C7; }
      .theme-grid { stroke: rgba(100, 116, 139, 0.18); }
      .theme-sym { fill: #0284C7; }
    }
  </style>

  <!-- Coordinate Grid & Math Axis -->
  <g class="theme-grid" stroke-dasharray="3,3" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="115" x2="1200" y2="115" stroke-dasharray="none" stroke-width="1.2" opacity="0.6" />
    <line x1="300" y1="20" x2="300" y2="120" />
    <line x1="600" y1="20" x2="600" y2="120" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="900" y1="20" x2="900" y2="120" />
  </g>

