  <!-- Mathematical & Data Science Symbols floating on crests -->
  <g class="math-elements">
    <g class="sym-1" transform="translate(120, 36)">
      <text class="math-symbol" font-size="16">∫ f(x)dx</text>
    </g>
    <g class="sym-2" transform="translate(320, 28)">
      <text class="math-symbol" font-size="18">∇L(θ)</text>
    </g>
    <g class="sym-3" transform="translate(540, 42)">
      <text class="math-symbol" font-size="19">∑ xᵢ</text>
    </g>
    <g class="sym-4" transform="translate(760, 30)">
      <text class="math-symbol" font-size="17">σ(W·x + b)</text>
    </g>
    <g class="sym-5" transform="translate(980, 38)">
      <text class="math-symbol" font-size="18">E[X]</text>
    </g>
    <g class="sym-2" transform="translate(1120, 28)">
      <text class="math-symbol" font-size="16">λ ∈ ℝⁿ</text>
    </g>
  </g>

  <!-- Constellation Nodes on Curve -->
  <g class="data-nodes" filter="url(#glow)">
    <circle cx="210" cy="52" r="3" fill="#06b6d4" />
    <circle cx="430" cy="48" r="3.5" fill="#a855f7" />
    <circle cx="670" cy="58" r="3" fill="#ec4899" />
