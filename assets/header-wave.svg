<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Cyberpunk Linear Gradients for Mathematical Wave Interference -->
    <linearGradient id="hGradBack" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="hGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="hGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="hGradLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    @keyframes waveLeft {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-600px, 0, 0); }
    }
    @keyframes waveRight {
      0% { transform: translate3d(-600px, 0, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    .wave-back {
      animation: waveRight 18s linear infinite;
    }
    .wave-mid {
      animation: waveLeft 12s linear infinite;
    }
    .wave-front {
      animation: waveRight 8s linear infinite;
    }
  </style>

  <!-- Layer 1: Background Harmonic Sine Wave (Cyan - Blue) -->
  <g class="wave-back">
    <path fill="url(#hGradBack)" d="M 0,42.0 C 108.0,28.0 192.0,28.0 300.0,42.0 C 408.0,56.0 492.0,56.0 600.0,42.0 C 708.0,28.0 792.0,28.0 900.0,42.0 C 1008.0,56.0 1092.0,56.0 1200.0,42.0 C 1308.0,28.0 1392.0,28.0 1500.0,42.0 C 1608.0,56.0 1692.0,56.0 1800.0,42.0 C 1908.0,28.0 1992.0,28.0 2100.0,42.0 C 2208.0,56.0 2292.0,56.0 2400.0,42.0 C 2508.0,28.0 2592.0,28.0 2700.0,42.0 C 2808.0,56.0 2892.0,56.0 3000.0,42.0 L 3000,0 L 0,0 Z" />
  </g>

  <!-- Layer 2: Middle Harmonic Sine Wave (Blue - Violet) -->
  <g class="wave-mid">
    <path fill="url(#hGradMid)" d="M 0,52.0 C 108.0,32.0 192.0,32.0 300.0,52.0 C 408.0,72.0 492.0,72.0 600.0,52.0 C 708.0,32.0 792.0,32.0 900.0,52.0 C 1008.0,72.0 1092.0,72.0 1200.0,52.0 C 1308.0,32.0 1392.0,32.0 1500.0,52.0 C 1608.0,72.0 1692.0,72.0 1800.0,52.0 C 1908.0,32.0 1992.0,32.0 2100.0,52.0 C 2208.0,72.0 2292.0,72.0 2400.0,52.0 C 2508.0,32.0 2592.0,32.0 2700.0,52.0 C 2808.0,72.0 2892.0,72.0 3000.0,52.0 L 3000,0 L 0,0 Z" />
  </g>

  <!-- Layer 3: Foreground Resonant Wave (Indigo - Purple - Pink) -->
  <g class="wave-front">
    <path fill="url(#hGradFront)" d="M 0,62.0 C 108.0,38.0 192.0,38.0 300.0,62.0 C 408.0,86.0 492.0,86.0 600.0,62.0 C 708.0,38.0 792.0,38.0 900.0,62.0 C 1008.0,86.0 1092.0,86.0 1200.0,62.0 C 1308.0,38.0 1392.0,38.0 1500.0,62.0 C 1608.0,86.0 1692.0,86.0 1800.0,62.0 C 1908.0,38.0 1992.0,38.0 2100.0,62.0 C 2208.0,86.0 2292.0,86.0 2400.0,62.0 C 2508.0,38.0 2592.0,38.0 2700.0,62.0 C 2808.0,86.0 2892.0,86.0 3000.0,62.0 L 3000,0 L 0,0 Z" />
    <!-- Glowing Resonant Line on Crest -->
    <path fill="none" stroke="url(#hGradLine)" stroke-width="1.8" d="M 0,62.0 C 108.0,38.0 192.0,38.0 300.0,62.0 C 408.0,86.0 492.0,86.0 600.0,62.0 C 708.0,38.0 792.0,38.0 900.0,62.0 C 1008.0,86.0 1092.0,86.0 1200.0,62.0 C 1308.0,38.0 1392.0,38.0 1500.0,62.0 C 1608.0,86.0 1692.0,86.0 1800.0,62.0 C 1908.0,38.0 1992.0,38.0 2100.0,62.0 C 2208.0,86.0 2292.0,86.0 2400.0,62.0 C 2508.0,38.0 2592.0,38.0 2700.0,62.0 C 2808.0,86.0 2892.0,86.0 3000.0,62.0" />
  </g>
</svg>