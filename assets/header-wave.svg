<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Dark Mode Gradients -->
    <linearGradient id="mathGrad1Dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="mathGrad2Dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="gaussFillDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulseLineDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Mathematical Coordinate Pattern -->
    <pattern id="mathGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.12"/>
      <circle cx="0" cy="0" r="1.2" fill="currentColor" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    :root {
      --bg-color: transparent;
      --grid-color: #8b5cf6;
      --text-math: #c084fc;
      --text-sub: #38bdf8;
      --axis-color: #94a3b8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --grid-color: #6366f1;
        --text-math: #7c3aed;
        --text-sub: #0284c7;
        --axis-color: #64748b;
      }
      #mathGrad1Dark stop:nth-child(1) { stop-color: #7c3aed; stop-opacity: 0.85; }
      #mathGrad1Dark stop:nth-child(2) { stop-color: #0284c7; stop-opacity: 0.9; }
      #mathGrad1Dark stop:nth-child(3) { stop-color: #db2777; stop-opacity: 0.85; }
      #mathGrad1Dark stop:nth-child(4) { stop-color: #7c3aed; stop-opacity: 0.85; }
      #gaussFillDark stop:nth-child(1) { stop-color: #0284c7; stop-opacity: 0.35; }
    }

    .symbol {
      font-family: "KaTeX_Math", "Cambria Math", "Latin Modern Math", "Times New Roman", serif;
      font-style: italic;
      user-select: none;
    }
    .floating-1 {
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .floating-2 {
      animation: floatMid 4.5s ease-in-out infinite alternate;
    }
    .floating-3 {
      animation: floatFast 5.2s ease-in-out infinite alternate;
    }
    .wave-pulse {
      animation: pulsePath 8s ease-in-out infinite alternate;
    }

    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.65; }
      100% { transform: translateY(-7px) rotate(3deg); opacity: 0.95; }
    }
    @keyframes floatMid {
      0% { transform: translateY(0px) scale(0.98); opacity: 0.55; }
      100% { transform: translateY(-6px) scale(1.05); opacity: 0.9; }
    }
    @keyframes floatFast {
      0% { transform: translateY(0px); opacity: 0.7; }
      100% { transform: translateY(-8px); opacity: 1; }
    }
    @keyframes pulsePath {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
  </style>

  <!-- Coordinate Grid Background -->
  <rect width="1000" height="140" fill="url(#mathGrid)" style="color: var(--grid-color);" />

  <!-- Gaussian Normal Distribution (Density Function Area) -->
  <path d="M 0,115 L 0.0,115.0 L 10.0,115.0 L 20.0,115.0 L 30.0,115.0 L 40.0,115.0 L 50.0,115.0 L 60.0,115.0 L 70.0,115.0 L 80.0,114.9 L 90.0,114.9 L 100.0,114.9 L 110.0,114.8 L 120.0,114.8 L 130.0,114.7 L 140.0,114.6 L 150.0,114.5 L 160.0,114.3 L 170.0,114.1 L 180.0,113.8 L 190.0,113.4 L 200.0,112.9 L 210.0,112.4 L 220.0,111.7 L 230.0,110.8 L 240.0,109.8 L 250.0,108.6 L 260.0,107.1 L 270.0,105.4 L 280.0,103.5 L 290.0,101.3 L 300.0,98.7 L 310.0,95.9 L 320.0,92.7 L 330.0,89.2 L 340.0,85.5 L 350.0,81.5 L 360.0,77.2 L 370.0,72.7 L 380.0,68.1 L 390.0,63.4 L 400.0,58.8 L 410.0,54.2 L 420.0,49.8 L 430.0,45.6 L 440.0,41.7 L 450.0,38.3 L 460.0,35.4 L 470.0,33.1 L 480.0,31.4 L 490.0,30.4 L 500.0,30.0 L 510.0,30.4 L 520.0,31.4 L 530.0,33.1 L 540.0,35.4 L 550.0,38.3 L 560.0,41.7 L 570.0,45.6 L 580.0,49.8 L 590.0,54.2 L 600.0,58.8 L 610.0,63.4 L 620.0,68.1 L 630.0,72.7 L 640.0,77.2 L 650.0,81.5 L 660.0,85.5 L 670.0,89.2 L 680.0,92.7 L 690.0,95.9 L 700.0,98.7 L 710.0,101.3 L 720.0,103.5 L 730.0,105.4 L 740.0,107.1 L 750.0,108.6 L 760.0,109.8 L 770.0,110.8 L 780.0,111.7 L 790.0,112.4 L 800.0,112.9 L 810.0,113.4 L 820.0,113.8 L 830.0,114.1 L 840.0,114.3 L 850.0,114.5 L 860.0,114.6 L 870.0,114.7 L 880.0,114.8 L 890.0,114.8 L 900.0,114.9 L 910.0,114.9 L 920.0,114.9 L 930.0,115.0 L 940.0,115.0 L 950.0,115.0 L 960.0,115.0 L 970.0,115.0 L 980.0,115.0 L 990.0,115.0 L 1000.0,115.0 L 1000,115 Z" fill="url(#gaussFillDark)" />
  <path d="M 0,115 L 0.0,115.0 L 10.0,115.0 L 20.0,115.0 L 30.0,115.0 L 40.0,115.0 L 50.0,115.0 L 60.0,115.0 L 70.0,115.0 L 80.0,114.9 L 90.0,114.9 L 100.0,114.9 L 110.0,114.8 L 120.0,114.8 L 130.0,114.7 L 140.0,114.6 L 150.0,114.5 L 160.0,114.3 L 170.0,114.1 L 180.0,113.8 L 190.0,113.4 L 200.0,112.9 L 210.0,112.4 L 220.0,111.7 L 230.0,110.8 L 240.0,109.8 L 250.0,108.6 L 260.0,107.1 L 270.0,105.4 L 280.0,103.5 L 290.0,101.3 L 300.0,98.7 L 310.0,95.9 L 320.0,92.7 L 330.0,89.2 L 340.0,85.5 L 350.0,81.5 L 360.0,77.2 L 370.0,72.7 L 380.0,68.1 L 390.0,63.4 L 400.0,58.8 L 410.0,54.2 L 420.0,49.8 L 430.0,45.6 L 440.0,41.7 L 450.0,38.3 L 460.0,35.4 L 470.0,33.1 L 480.0,31.4 L 490.0,30.4 L 500.0,30.0 L 510.0,30.4 L 520.0,31.4 L 530.0,33.1 L 540.0,35.4 L 550.0,38.3 L 560.0,41.7 L 570.0,45.6 L 580.0,49.8 L 590.0,54.2 L 600.0,58.8 L 610.0,63.4 L 620.0,68.1 L 630.0,72.7 L 640.0,77.2 L 650.0,81.5 L 660.0,85.5 L 670.0,89.2 L 680.0,92.7 L 690.0,95.9 L 700.0,98.7 L 710.0,101.3 L 720.0,103.5 L 730.0,105.4 L 740.0,107.1 L 750.0,108.6 L 760.0,109.8 L 770.0,110.8 L 780.0,111.7 L 790.0,112.4 L 800.0,112.9 L 810.0,113.4 L 820.0,113.8 L 830.0,114.1 L 840.0,114.3 L 850.0,114.5 L 860.0,114.6 L 870.0,114.7 L 880.0,114.8 L 890.0,114.8 L 900.0,114.9 L 910.0,114.9 L 920.0,114.9 L 930.0,115.0 L 940.0,115.0 L 950.0,115.0 L 960.0,115.0 L 970.0,115.0 L 980.0,115.0 L 990.0,115.0 L 1000.0,115.0 L 1000,115" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Gaussian Peak Confidence Limits Markers -->
  <line x1="500" y1="30" x2="500" y2="120" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.5"/>
  <line x1="390" y1="75" x2="390" y2="120" stroke="#8b5cf6" stroke-width="0.9" stroke-dasharray="2,3" opacity="0.35"/>
  <line x1="610" y1="75" x2="610" y2="120" stroke="#8b5cf6" stroke-width="0.9" stroke-dasharray="2,3" opacity="0.35"/>
  <circle cx="500" cy="30" r="3.5" fill="#38bdf8" filter="url(#softGlowDark)"/>

  <!-- Wave Layer 2 (Sub-Harmonic Shimmer) -->
  <path d="M 0,0 L 0,70 L 0.0,77.2 L 10.0,77.2 L 20.0,76.9 L 30.0,76.2 L 40.0,75.0 L 50.0,73.3 L 60.0,71.1 L 70.0,68.4 L 80.0,65.2 L 90.0,61.6 L 100.0,57.9 L 110.0,54.2 L 120.0,50.7 L 130.0,47.6 L 140.0,45.1 L 150.0,43.2 L 160.0,42.2 L 170.0,42.1 L 180.0,42.9 L 190.0,44.6 L 200.0,47.0 L 210.0,50.1 L 220.0,53.7 L 230.0,57.6 L 240.0,61.6 L 250.0,65.5 L 260.0,69.1 L 270.0,72.3 L 280.0,75.0 L 290.0,77.1 L 300.0,78.6 L 310.0,79.5 L 320.0,80.0 L 330.0,80.1 L 340.0,80.0 L 350.0,79.8 L 360.0,79.6 L 370.0,79.6 L 380.0,79.8 L 390.0,80.4 L 400.0,81.4 L 410.0,82.7 L 420.0,84.2 L 430.0,85.9 L 440.0,87.7 L 450.0,89.3 L 460.0,90.6 L 470.0,91.5 L 480.0,91.7 L 490.0,91.3 L 500.0,90.1 L 510.0,88.1 L 520.0,85.3 L 530.0,81.9 L 540.0,77.9 L 550.0,73.5 L 560.0,68.9 L 570.0,64.3 L 580.0,59.9 L 590.0,55.9 L 600.0,52.5 L 610.0,49.8 L 620.0,47.9 L 630.0,46.8 L 640.0,46.5 L 650.0,46.9 L 660.0,48.0 L 670.0,49.6 L 680.0,51.6 L 690.0,53.7 L 700.0,55.8 L 710.0,57.7 L 720.0,59.4 L 730.0,60.8 L 740.0,61.8 L 750.0,62.4 L 760.0,62.7 L 770.0,62.8 L 780.0,62.8 L 790.0,62.8 L 800.0,62.9 L 810.0,63.4 L 820.0,64.3 L 830.0,65.7 L 840.0,67.6 L 850.0,70.1 L 860.0,73.1 L 870.0,76.4 L 880.0,80.1 L 890.0,83.8 L 900.0,87.4 L 910.0,90.8 L 920.0,93.6 L 930.0,95.9 L 940.0,97.3 L 950.0,97.9 L 960.0,97.6 L 970.0,96.4 L 980.0,94.4 L 990.0,91.6 L 1000.0,88.3 L 1000,0 Z" fill="url(#mathGrad2Dark)"/>

  <!-- Wave Layer 1 (Primary Fourier Harmonic) -->
  <path d="M 0,0 L 0,65 L 0.0,65.0 L 10.0,69.2 L 20.0,73.4 L 30.0,77.3 L 40.0,81.0 L 50.0,84.3 L 60.0,87.2 L 70.0,89.6 L 80.0,91.5 L 90.0,92.8 L 100.0,93.7 L 110.0,94.0 L 120.0,93.8 L 130.0,93.2 L 140.0,92.2 L 150.0,90.8 L 160.0,89.2 L 170.0,87.4 L 180.0,85.5 L 190.0,83.6 L 200.0,81.8 L 210.0,80.0 L 220.0,78.4 L 230.0,77.0 L 240.0,75.8 L 250.0,74.9 L 260.0,74.1 L 270.0,73.6 L 280.0,73.2 L 290.0,73.0 L 300.0,72.9 L 310.0,72.8 L 320.0,72.6 L 330.0,72.4 L 340.0,72.0 L 350.0,71.4 L 360.0,70.5 L 370.0,69.3 L 380.0,67.8 L 390.0,66.0 L 400.0,63.8 L 410.0,61.4 L 420.0,58.6 L 430.0,55.7 L 440.0,52.6 L 450.0,49.4 L 460.0,46.2 L 470.0,43.1 L 480.0,40.2 L 490.0,37.5 L 500.0,35.1 L 510.0,33.2 L 520.0,31.7 L 530.0,30.8 L 540.0,30.5 L 550.0,30.7 L 560.0,31.5 L 570.0,33.0 L 580.0,34.9 L 590.0,37.4 L 600.0,40.3 L 610.0,43.6 L 620.0,47.2 L 630.0,50.9 L 640.0,54.8 L 650.0,58.7 L 660.0,62.5 L 670.0,66.1 L 680.0,69.5 L 690.0,72.6 L 700.0,75.3 L 710.0,77.6 L 720.0,79.5 L 730.0,81.0 L 740.0,82.1 L 750.0,82.8 L 760.0,83.1 L 770.0,83.1 L 780.0,82.9 L 790.0,82.5 L 800.0,82.0 L 810.0,81.4 L 820.0,80.9 L 830.0,80.4 L 840.0,80.1 L 850.0,79.9 L 860.0,79.9 L 870.0,80.1 L 880.0,80.5 L 890.0,81.0 L 900.0,81.7 L 910.0,82.6 L 920.0,83.4 L 930.0,84.3 L 940.0,85.1 L 950.0,85.7 L 960.0,86.1 L 970.0,86.2 L 980.0,86.0 L 990.0,85.4 L 1000.0,84.4 L 1000,0 Z" fill="url(#mathGrad1Dark)" filter="url(#softGlowDark)"/>

  <!-- Dynamic Signal Vector Line (Stochastic Data Wave) -->
  <path d="M 0.0,75.0 L 10.0,71.0 L 20.0,65.4 L 30.0,58.8 L 40.0,52.2 L 50.0,46.6 L 60.0,42.7 L 70.0,41.0 L 80.0,41.4 L 90.0,43.7 L 100.0,47.3 L 110.0,51.4 L 120.0,55.2 L 130.0,58.2 L 140.0,60.3 L 150.0,61.6 L 160.0,62.4 L 170.0,63.1 L 180.0,64.4 L 190.0,66.4 L 200.0,69.0 L 210.0,72.1 L 220.0,74.9 L 230.0,76.7 L 240.0,77.0 L 250.0,75.4 L 260.0,71.6 L 270.0,66.2 L 280.0,59.7 L 290.0,53.1 L 300.0,47.3 L 310.0,43.1 L 320.0,41.1 L 330.0,41.2 L 340.0,43.3 L 350.0,46.8 L 360.0,50.8 L 370.0,54.7 L 380.0,57.9 L 390.0,60.1 L 400.0,61.5 L 410.0,62.3 L 420.0,63.0 L 430.0,64.2 L 440.0,66.1 L 450.0,68.6 L 460.0,71.7 L 470.0,74.5 L 480.0,76.6 L 490.0,77.1 L 500.0,75.7 L 510.0,72.2 L 520.0,67.0 L 530.0,60.6 L 540.0,53.9 L 550.0,48.0 L 560.0,43.5 L 570.0,41.2 L 580.0,41.1 L 590.0,43.0 L 600.0,46.3 L 610.0,50.3 L 620.0,54.2 L 630.0,57.5 L 640.0,59.9 L 650.0,61.3 L 660.0,62.2 L 670.0,62.9 L 680.0,64.0 L 690.0,65.8 L 700.0,68.3 L 710.0,71.3 L 720.0,74.2 L 730.0,76.4 L 740.0,77.1 L 750.0,76.0 L 760.0,72.8 L 770.0,67.8 L 780.0,61.5 L 790.0,54.8 L 800.0,48.7 L 810.0,44.0 L 820.0,41.4 L 830.0,41.0 L 840.0,42.6 L 850.0,45.8 L 860.0,49.7 L 870.0,53.7 L 880.0,57.1 L 890.0,59.6 L 900.0,61.2 L 910.0,62.1 L 920.0,62.8 L 930.0,63.8 L 940.0,65.5 L 950.0,67.9 L 960.0,70.8 L 970.0,73.8 L 980.0,76.1 L 990.0,77.1 L 1000.0,76.3" fill="none" stroke="url(#pulseLineDark)" stroke-width="2.4" filter="url(#neonGlowDark)"/>

  <!-- Glowing Data Constellation Vertices -->
  <g filter="url(#neonGlowDark)">
    <circle cx="160" cy="85" r="3" fill="#38bdf8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="50" r="3.5" fill="#ec4899">
      <animate attributeName="r" values="3.5;5;3.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="30" r="4" fill="#a855f7">
      <animate attributeName="r" values="3;5;3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="78" r="3" fill="#38bdf8">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="55" r="3.5" fill="#ec4899">
      <animate attributeName="r" values="3;5;3" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Mathematical Formula Glyphs Floating Across Spectrum -->
  <g class="symbol">
    <!-- Fourier & Integral Symbol -->
    <text x="80" y="38" font-size="22" fill="var(--text-math)" class="floating-1" filter="url(#softGlowDark)">∫</text>
    <text x="96" y="32" font-size="12" fill="var(--text-sub)" class="floating-1">e<tspan dy="-6" font-size="9">-iωt</tspan><tspan dy="6"> dt</tspan></text>

    <!-- Normal Distribution -->
    <text x="440" y="24" font-size="13" font-weight="bold" fill="var(--text-sub)" class="floating-2">𝒩(μ, σ²)</text>

    <!-- Summation & Calculus -->
    <text x="240" y="38" font-size="19" fill="var(--text-math)" class="floating-3">∑</text>
    <text x="256" y="34" font-size="11" fill="var(--text-sub)" class="floating-3">a<tspan dy="3" font-size="9">n</tspan><tspan dy="-3"> sin(nωt)</tspan></text>

    <!-- Linear Algebra Matrix Notation -->
    <text x="730" y="35" font-size="14" font-weight="bold" fill="var(--text-math)" class="floating-1">X<tspan dy="-5" font-size="10">T</tspan><tspan dy="5">X β = X<tspan dy="-5" font-size="10">T</tspan><tspan dy="5">y</tspan></tspan></text>

    <!-- Partial Derivative / Gradient Operator -->
    <text x="900" y="32" font-size="18" fill="var(--text-sub)" class="floating-2">∇L(θ)</text>
    
    <!-- Eigenvalue / Dimension -->
    <text x="610" y="34" font-size="14" fill="var(--text-math)" class="floating-3">λ ∈ ℝ<tspan dy="-5" font-size="10">n</tspan></text>
  </g>
</svg>