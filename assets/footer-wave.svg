  <!-- Mathematical & Statistical Symbols floating near bottom -->
  <g class="math-elements">
    <g class="sym-1" transform="translate(140, 92)">
      <text class="math-symbol" font-size="17">𝒩(μ, σ²)</text>
    </g>
    <g class="sym-2" transform="translate(360, 96)">
      <text class="math-symbol" font-size="18">ŷ = β₀ + β₁x</text>
    </g>
    <g class="sym-3" transform="translate(600, 90)">
      <text class="math-symbol" font-size="19">lim_{n→∞} aₙ</text>
    </g>
    <g class="sym-4" transform="translate(820, 95)">
      <text class="math-symbol" font-size="18">R² = 1 - SS_res/SS_tot</text>
    </g>
    <g class="sym-5" transform="translate(1040, 92)">
      <text class="math-symbol" font-size="18">min ||Ax - b||₂</text>
    </g>
  </g>

