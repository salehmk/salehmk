<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Dark Mode Gradients -->
    <linearGradient id="footerGrad1Dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="footerGrad2Dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="descentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlowFooter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlowFooter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Coordinate Grid Pattern -->
    <pattern id="footerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.12"/>
      <circle cx="0" cy="0" r="1.2" fill="currentColor" opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    :root {
      --grid-color-foot: #8b5cf6;
      --text-foot-math: #c084fc;
      --text-foot-sub: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --grid-color-foot: #6366f1;
        --text-foot-math: #7c3aed;
        --text-foot-sub: #0284c7;
      }
      #footerGrad1Dark stop:nth-child(1) { stop-color: #7c3aed; stop-opacity: 0.9; }
      #footerGrad1Dark stop:nth-child(2) { stop-color: #0284c7; stop-opacity: 0.85; }
      #footerGrad1Dark stop:nth-child(3) { stop-color: #db2777; stop-opacity: 0.85; }
      #footerGrad1Dark stop:nth-child(4) { stop-color: #7c3aed; stop-opacity: 0.9; }
    }

    .symbol {
      font-family: "KaTeX_Math", "Cambria Math", "Latin Modern Math", "Times New Roman", serif;
      font-style: italic;
      user-select: none;
    }
    .floating-f1 {
      animation: floatFoot1 5.5s ease-in-out infinite alternate;
    }
    .floating-f2 {
      animation: floatFoot2 4.8s ease-in-out infinite alternate;
    }
    .floating-f3 {
      animation: floatFoot3 6s ease-in-out infinite alternate;
    }

    @keyframes floatFoot1 {
      0% { transform: translateY(0px); opacity: 0.65; }
      100% { transform: translateY(-7px); opacity: 0.95; }
    }
    @keyframes floatFoot2 {
      0% { transform: translateY(0px) scale(0.97); opacity: 0.55; }
      100% { transform: translateY(-6px) scale(1.04); opacity: 0.9; }
    }
    @keyframes floatFoot3 {
      0% { transform: translateY(0px); opacity: 0.65; }
      100% { transform: translateY(-8px); opacity: 1; }
    }
  </style>

  <!-- Coordinate Grid Background -->
  <rect width="1000" height="140" fill="url(#footerGrid)" style="color: var(--grid-color-foot);" />

  <!-- Layer 2: Shimmer Under-wave -->
  <path d="M 0,140 L 0,75 L 0.0,61.4 L 10.0,59.1 L 20.0,56.8 L 30.0,54.5 L 40.0,52.4 L 50.0,50.6 L 60.0,49.2 L 70.0,48.4 L 80.0,48.2 L 90.0,48.8 L 100.0,50.2 L 110.0,52.5 L 120.0,55.7 L 130.0,59.7 L 140.0,64.5 L 150.0,69.8 L 160.0,75.6 L 170.0,81.7 L 180.0,87.7 L 190.0,93.6 L 200.0,99.0 L 210.0,103.8 L 220.0,107.7 L 230.0,110.7 L 240.0,112.4 L 250.0,113.0 L 260.0,112.3 L 270.0,110.3 L 280.0,107.3 L 290.0,103.2 L 300.0,98.2 L 310.0,92.6 L 320.0,86.6 L 330.0,80.3 L 340.0,74.1 L 350.0,68.1 L 360.0,62.6 L 370.0,57.8 L 380.0,53.7 L 390.0,50.5 L 400.0,48.2 L 410.0,46.9 L 420.0,46.4 L 430.0,46.8 L 440.0,47.9 L 450.0,49.7 L 460.0,51.9 L 470.0,54.4 L 480.0,57.1 L 490.0,59.9 L 500.0,62.6 L 510.0,65.2 L 520.0,67.7 L 530.0,70.0 L 540.0,72.0 L 550.0,73.9 L 560.0,75.7 L 570.0,77.4 L 580.0,79.1 L 590.0,80.8 L 600.0,82.6 L 610.0,84.6 L 620.0,86.7 L 630.0,88.9 L 640.0,91.3 L 650.0,93.6 L 660.0,95.8 L 670.0,97.9 L 680.0,99.7 L 690.0,101.0 L 700.0,101.7 L 710.0,101.8 L 720.0,101.0 L 730.0,99.4 L 740.0,97.0 L 750.0,93.7 L 760.0,89.5 L 770.0,84.7 L 780.0,79.2 L 790.0,73.4 L 800.0,67.3 L 810.0,61.3 L 820.0,55.5 L 830.0,50.1 L 840.0,45.5 L 850.0,41.7 L 860.0,39.0 L 870.0,37.4 L 880.0,37.1 L 890.0,38.0 L 900.0,40.1 L 910.0,43.3 L 920.0,47.6 L 930.0,52.7 L 940.0,58.4 L 950.0,64.5 L 960.0,70.8 L 970.0,76.9 L 980.0,82.8 L 990.0,88.2 L 1000.0,93.0 L 1000,140 Z" fill="url(#footerGrad2Dark)"/>

  <!-- Layer 1: Primary Asymptotic Horizon -->
  <path d="M 0,140 L 0,80 L 0.0,77.1 L 10.0,78.1 L 20.0,79.1 L 30.0,80.3 L 40.0,81.6 L 50.0,82.9 L 60.0,84.3 L 70.0,85.8 L 80.0,87.3 L 90.0,88.7 L 100.0,90.1 L 110.0,91.5 L 120.0,92.7 L 130.0,93.8 L 140.0,94.6 L 150.0,95.3 L 160.0,95.8 L 170.0,96.0 L 180.0,95.9 L 190.0,95.6 L 200.0,95.1 L 210.0,94.3 L 220.0,93.3 L 230.0,92.1 L 240.0,90.8 L 250.0,89.4 L 260.0,87.9 L 270.0,86.4 L 280.0,84.9 L 290.0,83.5 L 300.0,82.3 L 310.0,81.2 L 320.0,80.2 L 330.0,79.5 L 340.0,79.1 L 350.0,78.8 L 360.0,78.8 L 370.0,79.0 L 380.0,79.4 L 390.0,79.8 L 400.0,80.4 L 410.0,81.1 L 420.0,81.7 L 430.0,82.2 L 440.0,82.6 L 450.0,82.8 L 460.0,82.7 L 470.0,82.3 L 480.0,81.7 L 490.0,80.7 L 500.0,79.3 L 510.0,77.7 L 520.0,75.7 L 530.0,73.5 L 540.0,71.1 L 550.0,68.5 L 560.0,66.0 L 570.0,63.4 L 580.0,61.1 L 590.0,59.0 L 600.0,57.2 L 610.0,55.8 L 620.0,55.0 L 630.0,54.8 L 640.0,55.1 L 650.0,56.2 L 660.0,57.8 L 670.0,60.1 L 680.0,63.0 L 690.0,66.4 L 700.0,70.2 L 710.0,74.3 L 720.0,78.5 L 730.0,82.8 L 740.0,87.0 L 750.0,90.9 L 760.0,94.4 L 770.0,97.3 L 780.0,99.6 L 790.0,101.1 L 800.0,101.7 L 810.0,101.5 L 820.0,100.5 L 830.0,98.6 L 840.0,95.9 L 850.0,92.5 L 860.0,88.7 L 870.0,84.5 L 880.0,80.1 L 890.0,75.7 L 900.0,71.5 L 910.0,67.8 L 920.0,64.8 L 930.0,62.5 L 940.0,61.2 L 950.0,61.1 L 960.0,62.1 L 970.0,64.3 L 980.0,67.6 L 990.0,72.1 L 1000.0,77.6 L 1000,140 Z" fill="url(#footerGrad1Dark)" filter="url(#softGlowFooter)"/>

  <!-- Mathematical Optimization Trajectory: Gradient Descent to Global Minima -->
  <path d="M 0.0,85.0 L 10.0,82.8 L 20.0,79.8 L 30.0,76.1 L 40.0,71.8 L 50.0,67.1 L 60.0,62.1 L 70.0,56.8 L 80.0,51.5 L 90.0,46.2 L 100.0,41.0 L 110.0,36.0 L 120.0,31.4 L 130.0,27.2 L 140.0,23.4 L 150.0,20.1 L 160.0,17.3 L 170.0,15.0 L 180.0,13.4 L 190.0,12.2 L 200.0,11.6 L 210.0,11.5 L 220.0,11.9 L 230.0,12.7 L 240.0,13.9 L 250.0,15.5 L 260.0,17.3 L 270.0,19.4 L 280.0,21.6 L 290.0,24.0 L 300.0,26.4 L 310.0,28.9 L 320.0,31.2 L 330.0,33.5 L 340.0,35.7 L 350.0,37.7 L 360.0,39.6 L 370.0,41.2 L 380.0,42.5 L 390.0,43.7 L 400.0,44.6 L 410.0,45.2 L 420.0,45.6 L 430.0,45.7 L 440.0,45.6 L 450.0,45.3 L 460.0,44.9 L 470.0,44.2 L 480.0,43.4 L 490.0,42.5 L 500.0,41.6 L 510.0,40.5 L 520.0,39.4 L 530.0,38.3 L 540.0,37.2 L 550.0,36.1 L 560.0,35.1 L 570.0,34.1 L 580.0,33.3 L 590.0,32.5 L 600.0,31.8 L 610.0,31.3 L 620.0,30.8 L 630.0,30.5 L 640.0,30.2 L 650.0,30.1 L 660.0,30.1 L 670.0,30.2 L 680.0,30.4 L 690.0,30.7 L 700.0,31.0 L 710.0,31.4 L 720.0,31.8 L 730.0,32.3 L 740.0,32.8 L 750.0,33.3 L 760.0,33.8 L 770.0,34.3 L 780.0,34.8 L 790.0,35.2 L 800.0,35.6 L 810.0,36.0 L 820.0,36.3 L 830.0,36.6 L 840.0,36.8 L 850.0,37.0 L 860.0,37.1 L 870.0,37.2 L 880.0,37.2 L 890.0,37.2 L 900.0,37.1 L 910.0,37.0 L 920.0,36.9 L 930.0,36.7 L 940.0,36.5 L 950.0,36.3 L 960.0,36.1 L 970.0,35.9 L 980.0,35.7 L 990.0,35.4 L 1000.0,35.2" fill="none" stroke="url(#descentGrad)" stroke-width="2.6" filter="url(#neonGlowFooter)"/>

  <!-- Optimization Iteration Steps (Gradient Descent Dots) -->
  <g filter="url(#neonGlowFooter)">
    <circle cx="20" cy="38" r="4.2" fill="#ec4899"/>
    <circle cx="110" cy="72" r="3.6" fill="#f59e0b"/>
    <circle cx="230" cy="48" r="3.4" fill="#10b981"/>
    <circle cx="380" cy="38" r="3" fill="#38bdf8"/>
    <circle cx="560" cy="35" r="3" fill="#a855f7"/>
    <!-- Convergence Point (Optimal Minima) -->
    <circle cx="850" cy="35" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;6.5;4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="35" r="10" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6">
      <animate attributeName="r" values="6;16;6" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Mathematical Significance Glyphs -->
  <g class="symbol">
    <!-- Convergence to Minima -->
    <text x="60" y="115" font-size="15" font-weight="bold" fill="var(--text-foot-math)" class="floating-f1">θ<tspan dy="-4" font-size="10">*</tspan><tspan dy="4"> = arg min ℒ(θ)</tspan></text>

    <!-- Asymptote / Limit -->
    <text x="320" y="118" font-size="16" fill="var(--text-foot-sub)" class="floating-f2">lim <tspan font-size="11">t→∞</tspan> e<tspan dy="-5" font-size="9">-λt</tspan><tspan dy="5"> = 0</tspan></text>

    <!-- Expected Value / Probability -->
    <text x="560" y="115" font-size="15" fill="var(--text-foot-math)" class="floating-f3">𝔼[X] = ∫ x f(x) dx</text>

    <!-- Infinity & Q.E.D. -->
    <text x="790" y="116" font-size="18" fill="var(--text-foot-sub)" class="floating-f1">∀ ε > 0, ∃ δ > 0</text>
    <text x="945" y="115" font-size="16" font-weight="bold" fill="var(--text-foot-math)" class="floating-f2">∎ Q.E.D.</text>
  </g>
</svg>