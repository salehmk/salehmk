<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="footerGradFront" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="footerGradBack" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.35" />
    </linearGradient>
    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveLeft {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-600px, 0, 0); }
    }
    @keyframes waveRight {
      0% { transform: translate3d(-600px, 0, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    @keyframes floatSymbol {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(4px); opacity: 0.95; }
    }
    .wave-back {
      animation: waveRight 16s linear infinite;
    }
    .wave-front {
      animation: waveLeft 10s linear infinite;
    }
    .math-symbol {
      font-family: 'Cambria Math', 'Times New Roman', 'KaTeX_Math', Georgia, serif;
      font-style: italic;
      font-weight: bold;
      fill: #ffffff;
      opacity: 0.75;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
      user-select: none;
    }
    .sym-1 { animation: floatSymbol 4s ease-in-out infinite; }
    .sym-2 { animation: floatSymbol 5s ease-in-out infinite 1s; }
    .sym-3 { animation: floatSymbol 4.5s ease-in-out infinite 2s; }
    .sym-4 { animation: floatSymbol 6s ease-in-out infinite 0.5s; }
    .sym-5 { animation: floatSymbol 5.5s ease-in-out infinite 1.5s; }
  </style>

  <!-- Mathematical Coordinate Grid Overlay -->
  <g class="math-grid">
    <line x1="0" y1="30" x2="1200" y2="30" stroke="rgba(139, 92, 246, 0.12)" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="0" y1="60" x2="1200" y2="60" stroke="rgba(139, 92, 246, 0.12)" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="0" y1="90" x2="1200" y2="90" stroke="rgba(139, 92, 246, 0.12)" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="100" y1="0" x2="100" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="200" y1="0" x2="200" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="400" y1="0" x2="400" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="500" y1="0" x2="500" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="700" y1="0" x2="700" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="800" y1="0" x2="800" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="1000" y1="0" x2="1000" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="1100" y1="0" x2="1100" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
    <line x1="1200" y1="0" x2="1200" y2="120" stroke="rgba(6, 182, 212, 0.08)" stroke-dasharray="2 6" stroke-width="1" />
  </g>

