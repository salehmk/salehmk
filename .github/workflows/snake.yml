name: Generate Snake Animation

on:
  schedule:
    # Run every 8 hours to keep the animation fresh
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E11D48&color_dots=#ebedf0,#fecdd3,#fb7185,#e11d48,#be123c
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF2A55&color_dots=#161b22,#4c0519,#881337,#be123c,#fb7185
            dist/github-contribution-grid-snake-crimson.svg?color_snake=#FF2A55&color_dots=#161b22,#4c0519,#881337,#be123c,#fb7185
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update Snake Contribution animation [skip ci]"
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
