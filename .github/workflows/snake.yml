name: Profile Animations & Stats Updater

on:
  schedule:
    # Run every 8 hours to keep animation and metrics fresh
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preload existing assets from output branch
        run: |
          mkdir -p dist
          git clone --depth 1 --branch output https://github.com/${{ github.repository }}.git output_clone || true
          if [ -d "output_clone" ]; then
            cp -r output_clone/*.svg dist/ 2>/dev/null || true
            rm -rf output_clone
          fi

      - name: Generate Snake Contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E11D48&color_dots=#ebedf0,#fecdd3,#fb7185,#e11d48,#be123c
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF2A55&color_dots=#161b22,#4c0519,#881337,#be123c,#fb7185
            dist/github-contribution-grid-snake-crimson.svg?color_snake=#FF2A55&color_dots=#161b22,#4c0519,#881337,#be123c,#fb7185
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and Cache Profile Stats SVGs
        run: |
          mkdir -p dist

          fetch_svg() {
            local url="$1"
            local out="$2"
            local tmp="${out}.tmp"
            echo "Fetching $out..."
            if curl -s -f -m 15 "$url" -o "$tmp" && grep -q "<svg" "$tmp"; then
              mv "$tmp" "$out"
              echo "Successfully updated $out"
            else
              echo "Warning: Failed to fetch $url or invalid SVG, retaining cached copy"
              rm -f "$tmp"
            fi
          }

          # 1. GitHub Stats Cards
          fetch_svg "https://github-readme-stats.shion.dev/api?username=salehmk&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=FF2A55&icon_color=FF2A55&text_color=FFFFFF" "dist/stats-dark.svg"
          fetch_svg "https://github-readme-stats.shion.dev/api?username=salehmk&show_icons=true&include_all_commits=true&hide_border=false&border_color=D0D7DE&bg_color=FFFFFF&title_color=BE123C&icon_color=DC2626&text_color=0F172A" "dist/stats-light.svg"

          # 2. Top Languages Cards (Compact Progress Bar)
          fetch_svg "https://github-readme-stats.shion.dev/api/top-langs/?username=salehmk&layout=compact&hide_border=true&bg_color=0D1117&title_color=FF2A55&text_color=FFFFFF" "dist/languages-dark.svg"
          fetch_svg "https://github-readme-stats.shion.dev/api/top-langs/?username=salehmk&layout=compact&hide_border=false&border_color=D0D7DE&bg_color=FFFFFF&title_color=BE123C&text_color=0F172A" "dist/languages-light.svg"

          # 3. GitHub Streak Stats
          fetch_svg "https://streak-stats.demolab.com/?user=salehmk&hide_border=true&background=0D1117&ring=FF2A55&fire=FF2A55&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=FF2A55&sideLabels=FF2A55&dates=FFFFFF&stroke=30363D" "dist/streak-dark.svg"
          fetch_svg "https://streak-stats.demolab.com/?user=salehmk&hide_border=false&border=D0D7DE&background=FFFFFF&ring=BE123C&fire=E11D48&currStreakNum=0F172A&sideNums=0F172A&currStreakLabel=BE123C&sideLabels=BE123C&dates=334155&stroke=E2E8F0" "dist/streak-light.svg"

          # 4. Pinned Repositories Cards
          REPOS=("asac-sql-portfolio" "Sunnah-Data" "football-logos" "ZipCompressor")
          for repo in "${REPOS[@]}"; do
            fetch_svg "https://github-readme-stats.shion.dev/api/pin/?username=salehmk&repo=${repo}&hide_border=true&bg_color=0D1117&title_color=FF2A55&icon_color=FF2A55&text_color=FFFFFF&description_lines_count=2" "dist/pin-${repo}-dark.svg"
            fetch_svg "https://github-readme-stats.shion.dev/api/pin/?username=salehmk&repo=${repo}&hide_border=false&border_color=D0D7DE&bg_color=FFFFFF&title_color=BE123C&icon_color=DC2626&text_color=0F172A&description_lines_count=2" "dist/pin-${repo}-light.svg"
          done

      - name: Deploy animations and stats to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update Snake animation and cached profile stats [skip ci]"
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
