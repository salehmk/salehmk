name: Generate GitHub Metrics

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recent Activity
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: salehmk
          committer_branch: output
          committer_message: "chore: update activity metrics [skip ci]"
          output_action: commit
          base: ""
          config_timezone: Asia/Amman
          plugins_errors_fatal: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

      - name: Coding Habits & Patterns
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: salehmk
          committer_branch: output
          committer_message: "chore: update habits metrics [skip ci]"
          output_action: commit
          base: ""
          config_timezone: Asia/Amman
          plugins_errors_fatal: yes
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
