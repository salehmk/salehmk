name: Generate GitHub Metrics

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    name: Generate Full GitHub Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Full Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: salehmk
          committer_branch: output
          committer_message: "chore: update full metrics [skip ci]"
          output_action: commit
          base: header, activity, community, repositories
          config_timezone: Asia/Amman
          config_order: base.header, isocalendar, habits, activity
          
          # 3D Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Coding Habits & Productivity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Recent Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_timestamps: yes
